# Kinetica Integration Test Configuration
# These values are filtered during build (see pom.xml testResources)

# Kinetica connection settings
kinetica.url=${kinetica.url}
kinetica.username=${kinetica.username}
kinetica.password=${kinetica.password}

# Test table settings
it.test.table.prefix=${it.test.table.prefix}

# Test timeouts (milliseconds)
it.connection.timeout=30000
it.query.timeout=60000

# Performance test thresholds
it.perf.min.records.per.second=5000
